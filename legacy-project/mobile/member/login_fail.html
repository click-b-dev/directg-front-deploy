$(document).ready(function(){
	$("#btn_login").bind("click",function(){
		var m_id = $("input[name='m_id']").val();
		var m_pwd = $("input[name='m_pwd']").val();
		
		if(m_id==""){
			alert("아이디를 입력해주세요.");
			return false;
		}
		
		if(m_pwd==""){
			alert("비밀번호를 입력해주세요.");
			return false;
		}

		$.ajax({
			'url': 'login_proc.php',
			'type': 'POST',
			'dataType': 'json',
			'data':{m_id:m_id,m_pwd:m_pwd},
			'success': function (data) {
				console.log(data);
				alert(data.error_msg);
			},
			'error':function(data){
				alert(data);
				console.log(data);
			}
		});
	});
	
	//네이버 간편로그인
	$("#btn_login_naver").bind("click",function(){
		var top = (screen.availHeight - 600)/2;
		var left = (screen.availWidth - 455)/2;
		$.ajax({
			url : "/api/naver/naver_login.php",
			type: "POST",
			data : {mode:"naver_login"},
			success:function(url, textStatus, jqXHR){
				var loginpop = window.open (url, 'login_naver', 'height=700, width=500, top='+ top +', left='+ left +', toolbar=no, menubar=no, scrollbars=no,resizable=yes,location=no, status=no');
				if (loginpop == null || typeof(loginpop) == "undefined" || (loginpop == null && loginpop.outerWidth == 0) || (loginpop != null && loginpop.outerHeight == 0) || loginpop.test == "undefined"){
						alert("팝업이 차단되어있습니다.\n로그인 하시려면 팝업 차단을 해제해주시기 바랍니다.");
						//빈창 닫기
						if(loginpop){
							loginpop.close();
						}
				}
			},
			error: function(jqXHR, textStatus, errorThrown) {
				alert(jqXHR);
			}
		 });
	});
