<script type="text/javascript">
	$("#btn_id_chk").bind("click",function(){
		const id = $("#m_id").val();

		if($("#m_id").val()==""){
			alert("아이디를 입력하세요.");
			return;
		}else{
			$.ajax({
				'url': 'join_proc.php',
				'type': 'POST',
				'dataType':'json',
				'data':{mode:"idChk",m_id:id},
				'success': function(data){
					console.log(data);
					if(data.error_code=="1"){
						alert(data.msg);
						$("#id_chk").val("");
						$("#m_id").val("");
						return;
					}else{
						$("#id_chk").val("1");
						alert("등록이 가능한 아이디입니다.");
						return;
					}
				},
				'error':function(data){
					console.log(data);
					alert("에러입니다.");
				}
			});
		}
	});
	
	/* 예제 */
	window.onload=function(){
		Fingerprint2.get(function(components) {
			var murmur = Fingerprint2.x64hash128(components.map(function (pair) { return pair.value }).join(), 31);
			$("#visitorId").val(murmur);
		});
	}
	
	$(document).ready(function() {
		$('#form_auth').on('submit', function(e) {
			e.preventDefault();

			const pwd = $("#m_pwd").val();
			const num = pwd.search(/[0-9]/g);
			const eng = pwd.search(/[a-z]/ig);
			const spe = pwd.search(/[`~!#$%^&*()|\\\'\_";:\/?]/gi);
			const spe2 = pwd.match(/[^0-9a-z`~!#$%\^&*\(\)|\\\'\_\";:\/?]/gi);
			const spa = checkSpace(pwd);
			const form = this;

			if($("#id_chk").val()==""){
				alert("아이디 중복확인을 하세요.");
				return false;
			}

			if(pwd.length<8 || pwd.length>16){
				alert("비밀번호는 영문소문자, 숫자, 특수문자를 포함 8자리 이상 ~ 16이하로 입력해주세요.");
				return false;
			}

			if(num < 0 || eng <0 || spe <0){
				alert("비밀번호는 영문소문자, 숫자, 특수문자를 포함 8자리 이상 ~ 16이하로 입력해주세요.");
				return false;
			}

			if(spa){
				alert("비밀번호는 공백없이 입력해주세요.");
				return false;
			}

			if(spe2){
				alert("비밀번호에 사용할 수 없는 문자가 포함되어 있습니다.");
				return false;
			}

			if($("#m_pwd").val() != $("#m_pwd_re").val()){
				alert("비밀번호와 비밀번호 확인이 일치하지 않습니다.");
				return false;
			}

			runCaptcha();
		});
	});
	
	function checkSpace(str){
		if(str.search(/\s/)!=-1){
			return true;
		}else{
			return false;
		}
	}
</script>

<script>
function onCaptchaSuccess(token) {
	var form = document.form_auth;
	var postData = $('#form_auth').serializeArray();
	postData.push({ name: 'h-captcha-response', value: token });

	$.ajax({
		url: '/member/join_proc.php',
		type: 'POST',
		data: postData,
		dataType: 'json',
		success: function(data) {
			if (data.error_code == 0) {
				form.action = '/member/join_step4.html';
				form.submit();
			} else if (data.error_code == 2) {
				alert(data.msg);
				form.action = '/member/join_step4.html';
				form.submit();
			} else {
				$.LoadingOverlay("hide", true);
				alert(data.msg);
				hcaptcha.reset(hcaptchaWidgetID);
			}
		},
		error: function() {
			$.LoadingOverlay("hide", true);
			alert("회원가입 중 오류가 발생했습니다.");
			hcaptcha.reset(hcaptchaWidgetID);
		}
	});
}
</script>
