<script type="text/javascript">
$(document).ready(function(){
	$('#btn_auth_confirm').bind("click",function(){
		var auth_code = $("#auth_code").val();
		var token = $("#token").val();
		var m_id = $("#m_id").val();

		if(auth_code==""){
			alert("인증번호를 입력하세요.");
			return false;
		}

		$.ajax({
			url : "user_certification_proc.php",
			type: 'POST',
			dataType:'json',
			data : {mode:"authConfirm",auth_code:auth_code,token:token,m_id:m_id},
			success:function(data){
				//console.log(data);
				//비밀번호 변경으로 이동
				if(data.code=="ok"){
					$('#formAuthConfirm').attr("action","find_password_reset.html");
					$('#formAuthConfirm').submit();
				}else{
					alert(data.message);
				}
			},
			error:function(data){
				alert("에러");
			}
		});
	});

	$('#formAuthConfirm').keydown(function(e) {
		if (e.keyCode == 13) {
			event.preventDefault();
			var auth_code = $("#auth_code").val();
			var token = $("#token").val();
			var m_id = $("#m_id").val();

			if(auth_code==""){
				alert("인증번호를 입력하세요.");
				return false;
			}

			$.ajax({
				url : "user_certification_proc.php",
				type: 'POST',
				dataType:'json',
				data : {mode:"authConfirm",auth_code:auth_code,token:token,m_id:m_id},
				success:function(data){
					//console.log(data);
					//비밀번호 변경으로 이동
					if(data.code=="ok"){
						$('#formAuthConfirm').attr("action","find_password_reset.html");
						$('#formAuthConfirm').submit();
					}else{
						alert(data.message);
					}
				},
				error:function(data){
					alert("에러");
				}
			});
		}
	});
});
</script>
