<script type="text/javascript">
$(document).ready(function(){
	$('#btn_reset').bind("click",function(){
		var token = $("#token").val();
		var m_id = $("#m_id").val();
		var new_pwd = $('input[name="new_pwd"]').val();
		var new_pwd_re = $('input[name="new_pwd_re"]').val();

		if(new_pwd==""){
			alert("변경할 비밀번호를 입력하세요.");
			return false;
		}
		
		if(new_pwd_re==""){
			alert("새 비밀번호 확인을 입력하세요.");
			return false;
		}
		
		if(new_pwd!=new_pwd_re){
			alert("변경할 비밀번호와 새 비밀번호 확인이 일치하지 않습니다.");
			return false;
		}
		
		var postData = $('#formReset').serializeArray();

		$.ajax({
			url : "find_password_reset_proc.php",
			type: 'POST',
			dataType:'json',
			data : postData,
			success:function(data){
				//비밀번호 변경으로 이동
				if(data.code=="ok"){
					location.href="find_password_complete.html";
				}else{
					alert(data.message);
				}
			},
			error:function(data){
				alert("에러");
			}
		});
	});
});
</script>
