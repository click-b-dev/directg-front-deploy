<script>
$(document).ready(function() {
	$('#frm').on('submit', function(e) {
		e.preventDefault();
		var formData = new FormData(this);
		$.LoadingOverlay("show");
		$.ajax({
			url: $(this).attr('action'),
			type: 'POST',
			data: formData,
			contentType: false,
			processData: false,
			dataType: 'json',
			success: function(data) {
				$.LoadingOverlay("hide");
				alert(data.error_msg);
				location.reload();
			},
			error: function(xhr, status, error) {
				console.log(xhr);
				console.log(status);
				console.log(error);
				alert('고객문의 등록 중 오류가 발생했습니다. ' + error);
			}
		});
	});
});
</script>
