<script src="https://ssl.daumcdn.net/dmaps/map_js_init/postcode.v2.js"></script>
<script type="text/javascript">
	//본 예제에서는 도로명 주소 표기 방식에 대한 법령에 따라, 내려오는 데이터를 조합하여 올바른 주소를 구성하는 방법을 설명합니다.
	function sample4_execDaumPostcode() {
		new daum.Postcode({
			oncomplete: function(data) {
				 // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

				// 각 주소의 노출 규칙에 따라 주소를 조합한다.
				// 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
				var fullAddr = ''; // 최종 주소 변수
				var extraAddr = ''; // 조합형 주소 변수

				// 사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
				if (data.userSelectedType === 'R') { // 사용자가 도로명 주소를 선택했을 경우
					fullAddr = data.roadAddress;

				} else { // 사용자가 지번 주소를 선택했을 경우(J)
					fullAddr = data.jibunAddress;
				}

				// 사용자가 선택한 주소가 도로명 타입일때 조합한다.
				if(data.userSelectedType === 'R'){
					//법정동명이 있을 경우 추가한다.
					if(data.bname !== ''){
						extraAddr += data.bname;
					}
					// 건물명이 있을 경우 추가한다.
					if(data.buildingName !== ''){
						extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
					}
					// 조합형주소의 유무에 따라 양쪽에 괄호를 추가하여 최종 주소를 만든다.
					fullAddr += (extraAddr !== '' ? ' ('+ extraAddr +')' : '');
				}

				// 우편번호와 주소 정보를 해당 필드에 넣는다.
				document.getElementById('zipcode').value = data.zonecode; //5자리 새우편번호 사용
				document.getElementById('address').value = fullAddr;

				// 커서를 상세주소 필드로 이동한다.
				document.getElementById('address_detail').focus();
			},
			 onclose: function(state) {
					//state는 우편번호 찾기 화면이 어떻게 닫혔는지에 대한 상태 변수 이며, 상세 설명은 아래 목록에서 확인하실 수 있습니다.
					if(state === 'FORCE_CLOSE'){
						//사용자가 브라우저 닫기 버튼을 통해 팝업창을 닫았을 경우, 실행될 코드를 작성하는 부분입니다.

					} else if(state === 'COMPLETE_CLOSE'){
						//사용자가 검색결과를 선택하여 팝업창이 닫혔을 경우, 실행될 코드를 작성하는 부분입니다.
						//oncomplete 콜백 함수가 실행 완료된 후에 실행됩니다.
						return false;
					}
				}

		}).open();
	}

$(document).ready(function(){
	$("#btn_zipcode").bind("click",function(){
		sample4_execDaumPostcode();
	});
	$("#addressFrm").on('submit', function(e) {
		e.preventDefault();
		if($("#zipcode").val()==""){
			alert("주소를 입력하셔야 합니다.");
			$("#zipcode").focus();
			return false;
		}
		if($("#address").val()==""){
			alert("주소를 입력하셔야 합니다.");
			$("#address").focus();
			return false;
		}
		var postData = $("#addressFrm").serializeArray();
		$.LoadingOverlay("show");

		$.ajax({
			url : "address_proc.php",
			type: "POST",
			data : postData,
			dataType: "json",
			success:function(data){
				alert(data.error_msg);
				$.LoadingOverlay("hide");
//				location.reload();
			},
		error: function(data) {
				alert("주소 변경 중 오류가 발생했습니다.");
				$.LoadingOverlay("hide");
			}
		});
	});
});

const phone = document.getElementById("phone");
if (phone) {
	document.getElementById("phone").addEventListener("input", function(e) {
		let value = e.target.value.replace(/[^0-9]/g, ''); // 숫자만 추출
		let result = '';

		// 서울 지역번호: 02
		if (value.startsWith('02')) {
			if (value.length < 6) {
				result = value.replace(/(\d{2})(\d{0,3})/, '$1-$2');
			} else if (value.length < 10) {
				result = value.replace(/(\d{2})(\d{3})(\d{0,4})/, '$1-$2-$3'); // 02-123-4567
			} else {
				result = value.slice(0, 10).replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3'); // 02-1234-5678
			}
		} else if (value.startsWith('0')) {
			// 그 외 지역번호 또는 휴대폰
			if (value.length < 7) {
				result = value.replace(/(\d{3})(\d{0,3})/, '$1-$2');
			} else if (value.length < 11) {
				result = value.replace(/(\d{3})(\d{3})(\d{0,4})/, '$1-$2-$3'); // 031-123-1234
			} else {
				result = value.slice(0, 11).replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3'); // 010-1234-5678
			}
		} else {
			result = value;
		}

		e.target.value = result;
	});
}
</script>
