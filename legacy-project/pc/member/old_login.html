<script>

	function onSubmit(token) {
		const m_id = $("#m_id").val();
		const m_pwd = $("#m_pwd").val();
		const return_url = $("#return_url").val();
		
		$.ajax({
			'url': 'yjs_login_proc.php',
			'type': 'POST',
			'dataType': 'json',
			'data':{m_id:m_id,m_pwd:m_pwd,token:token},
			'success': function (data) {
				console.log(data);
				if(data.error_code=="0" || data.error_msg=="OK"){
					if(return_url){
						location.href = return_url;
					}else{
						location.href="/";
					}
				} else if(data.error_code=="1"){
					alert(data.error_msg);
				}
			},
			'error':function(data){
				alert(data);
				console.log(data);
			}
		});
	};
