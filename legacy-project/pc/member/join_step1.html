<script>
$(document).ready(function(){
	//네이버 간편로그인
	$("#btn_join_naver").bind("click",function(){
		var top = (screen.availHeight - 600)/2;
		var left = (screen.availWidth - 455)/2;
		$.ajax({
			url : "/api/naver/naver_login.php",
			type: "POST",
			data : {mode:"naver_login"},
			success:function(url, textStatus, jqXHR){
				var loginpop = window.open (url, 'login_naver', 'height=700, width=500, top='+ top +', left='+ left +', toolbar=no, menubar=no, scrollbars=no,resizable=yes,location=no, status=no');
				if (loginpop == null || typeof(loginpop) == "undefined" || (loginpop == null && loginpop.outerWidth == 0) || (loginpop != null && loginpop.outerHeight == 0) || loginpop.test == "undefined"){

						//빈창 닫기
						if(loginpop){
							loginpop.close();
						}
				}
			},
			error: function(jqXHR, textStatus, errorThrown) {

function join_naver(memberInfo_idNo){
		var $form = $('<form></form>');
		$form.attr('action', 'join_step2.html');
		$form.attr('method', 'post');
		//$form.attr('target', 'ifrmProcess');
		$form.appendTo('body');
		var sns_id = $('<input type="hidden" name="sns_id" value="'+memberInfo_idNo+'">');
		var sns_type = $('<input type="hidden" name="sns_type" value="naver">');
		$form.append(sns_id);
		$form.append(sns_type);
		$form.submit();
	}
	
	function join_kakao(memberInfo_idNo){

	function join_payco(sns_id,sns_email,name,access_token){
		var $form = $('<form></form>');
		$form.attr('action', 'join_step2.html');
		$form.attr('method', 'post');

		var sns_type = $('<input type="hidden" name="sns_type" value="payco">');
