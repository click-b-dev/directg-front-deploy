<script>
$(document).ready(function() {
	$('#passwordFrm').on('submit', function(e) {
		e.preventDefault();
		const postData = $('#passwordFrm').serializeArray();
		$.ajax({
			url: '/member/join_proc.php',
			type: 'POST',
			data: postData,
			dataType: 'json',
			success: function(data) {
				//console.log(data);
				if(data.error_code=="0"){
					alert(data.msg);
					$('#m_id').val(data.m_id);
					$('#token').val(data.token);
					$('#memberFrm').submit();
				}
			},
			error: function(xhr, status, error) {
				//console.log(xhr);
				//console.log(status);
				//console.log(error);
				alert('비밀번호찾기 중 오류가 발생했습니다. ' + error);
			}
		});
	});
});

</script>
