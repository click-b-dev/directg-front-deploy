<script>
$(document).ready(function() {
	$('#memberFrm').on('submit', function(e) {
		e.preventDefault();
		const postData = $('#memberFrm').serializeArray();
		$.ajax({
			url: '/member/join_proc.php',
			type: 'POST',
			data: postData,
			dataType: 'json',
			success: function(data) {
				//console.log(data);
				if(data.error_code=="0"){
					alert(data.msg);
					$("#passwordResetFrm input[name='auth_code']").val(data.auth_code);
					$("#passwordResetFrm input[name='token']").val(data.token);
					$("#passwordResetFrm").submit();
				} else {
					alert(data.msg);
					
				}
			},
			error: function(xhr, status, error) {
				//console.log(xhr);
				//console.log(status);
				//console.log(error);
				alert('비밀번호찾기 중 오류가 발생했습니다. ' + error);
			}
		});
	});
});

</script>
