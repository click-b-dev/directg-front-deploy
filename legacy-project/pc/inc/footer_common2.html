	$("input[type=radio]").on("click", function() {
		let $this = $(this);

		// 이미 체크된 상태라면 해제
		if ($this.data("waschecked") === "checked") {
			$this.prop("checked", false);
			$this.data("waschecked", false);
		} else {
			// 다른 라디오들은 상태 초기화
			$("input[name='" + $this.attr("name") + "']").data("waschecked", false);

			// 현재 라디오만 체크 상태 저장
			$this.data("waschecked", "checked");
		}
	});

	$('button[name=search_price]').on('click',function(){
		$('#min_price').val($(this).data('minprice'));
		$('#max_price').val($(this).data('maxprice'));
	});

	$("#btn_reset").on('click', function() {
		$('#sidebar input[type="checkbox"], #sidebar input[type="radio"]').prop('checked', false);
		$('#topbar input[type="checkbox"], #topbar input[type="radio"]').prop('checked', false);
		$('#topbar input[type="checkbox"], #topbar input[type="radio"]').trigger('change');
		$('#topbar #min_price').val('');
		$('#topbar #max_price').val('');
	});
});


document.addEventListener("DOMContentLoaded", function() {
	const collapseEl = document.getElementById('filter_body');
	if (collapseEl){ // 필터가 없으면 스크립트 중단
		const savedState = localStorage.getItem('filterBodyCollapse');

		// 초기 렌더링 시 클래스 적용
		if (savedState === 'hide') {
			collapseEl.classList.remove('show');
		} else {
			collapseEl.classList.add('show');
		}

		// Bootstrap Collapse 제어
		const bsCollapse = new bootstrap.Collapse(collapseEl, { toggle: false });

		collapseEl.addEventListener('shown.bs.collapse', () => {
			localStorage.setItem('filterBodyCollapse', 'show');
		});
		collapseEl.addEventListener('hidden.bs.collapse', () => {
			localStorage.setItem('filterBodyCollapse', 'hide');
		});
	}
});
