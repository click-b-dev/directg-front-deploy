	$("input[type=radio]").on("click", function() {
		let $this = $(this);

		// 이미 체크된 상태라면 해제
		if ($this.data("waschecked") === "checked") {
			$this.prop("checked", false);
			$this.data("waschecked", false);
		} else {
			// 다른 라디오들은 상태 초기화
			$("input[name='" + $this.attr("name") + "']").data("waschecked", false);

			// 현재 라디오만 체크 상태 저장
			$this.data("waschecked", "checked");
		}
	});

	$('button[name=search_price]').on('click',function(){
		$('#min_price').val($(this).data('minprice'));
		$('#max_price').val($(this).data('maxprice'));
	});

document.addEventListener("DOMContentLoaded", function() {
	const collapseEl = document.getElementById('filter_body');
	if (collapseEl){ // 필터가 없으면 스크립트 중단
		const savedState = localStorage.getItem('filterBodyCollapse');

		// 초기 렌더링 시 클래스 적용
		if (savedState === 'hide') {
			collapseEl.classList.remove('show');
		} else {
			collapseEl.classList.add('show');
		}

		// Bootstrap Collapse 제어
		const bsCollapse = new bootstrap.Collapse(collapseEl, { toggle: false });

		collapseEl.addEventListener('shown.bs.collapse', () => {
			localStorage.setItem('filterBodyCollapse', 'show');
		});
		collapseEl.addEventListener('hidden.bs.collapse', () => {
			localStorage.setItem('filterBodyCollapse', 'hide');
		});
	}
});

<script>
//장바구니·위시리스트 모달을 닫으면 헤더 배지(갯수/빨간점)만 AJAX로 다시 그린다(새로고침 없음)
//'바로가기' 버튼으로 이동 중일 때는 갱신할 필요가 없으므로 제외
(function(){
	//배지 값만 받아오고, 그리는 것은 header.html 이 등록해둔 함수가 담당한다
	function refreshHeaderBadge(){
		fetch('/order/cart_proc.php', {
				method:'POST',
				credentials:'same-origin',
				headers:{'Content-Type':'application/x-www-form-urlencoded'},
				body:'mode=header_badge'
			})
			.then(function(res){ return res.json(); })
			.then(function(badge){
				if(badge.cart_cnt === undefined){ location.reload(); return; }
				(window.headerBadgeDrawers || []).forEach(function(draw){ draw(badge); });
			})
			.catch(function(){ location.reload(); });   //실패하면 기존 방식대로 새로고침
	}

	//뒤로가기로 돌아온 경우 — bfcache 로 DOM이 그대로 복원되어 배지가 이전 값으로 보인다.
	//(예: 장바구니 페이지에서 상품을 지우고 뒤로가기) 복원 감지 시 값만 다시 받아 갱신한다.
	window.addEventListener('pageshow', function(e){
		var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
		if(e.persisted || (nav && nav.type === 'back_forward')){
			refreshHeaderBadge();
		}
	});

	var targets = [
		{modal:'cart-modal', move:'btn_cart_move'},
		{modal:'wishlist-modal', move:'btn_wishlist_move'}
	];

	targets.forEach(function(target){
		var modal = document.getElementById(target.modal);
		if(!modal){ return; }

		var is_moving = false;
		var move_btn = modal.querySelector('#'+target.move);
		if(move_btn){
			move_btn.addEventListener('click', function(){ is_moving = true; });
		}

		modal.addEventListener('hidden.bs.modal', function(){
			if(is_moving){ return; }
			refreshHeaderBadge();
		});
	});
})();
</script>
