<div id="cart-modal" class="modal" tabindex="-1" role="dialog" aria-labelledby="primary-header-modalLabel" aria-hidden="true">
	<div class="modal-dialog modal-lg modal-dialog-centered" style="max-width:900px">
		<div class="modal-content border border-3 border-start border-end-0 border-top-0 border-bottom-0 border-primary">
			<div class="modal-header">
				<h4 class="modal-title" id="topModalLabel">장바구니</h4>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-hidden="true"></button>
			</div>
			<div class="modal-body p-2 rounded-0">
				<div id="cart_result" class="p-0"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-sm btn-dark shadow-none font-14" id="btn_model_close" data-bs-dismiss="modal">쇼핑 계속하기</button>
				<button type="button" class="btn btn-sm btn-primary shadow-none font-14" id="btn_cart_move">장바구니 바로가기</button>
			</div>
		</div>
	</div>
</div>
